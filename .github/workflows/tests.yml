name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Installs the runtime dependencies *and* the dev extra (pytest), and
        # puts the package on the path so `import app` resolves. Installing
        # requirements.txt alone left pytest missing, so this job failed with
        # `pytest: command not found` (exit 127) before it ran a single test.
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Compile check
        run: python -m py_compile app/*.py
